name: CodeQL

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        - cron: "23 6 * * 1" # weekly, Monday 06:23 UTC — picks up new CodeQL queries without a code change
    workflow_dispatch:

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    # build-mode none: no compile needed, so the csproj's npm SPA build target never runs
                    - language: csharp
                      build-mode: none
                    - language: javascript-typescript
                      build-mode: none
                    - language: actions
                      build-mode: none
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: "/language:${{ matrix.language }}"
